<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" role="img" aria-label="chronicle — read &amp; write file history">
  <title>chronicle — read &amp; write file history</title>

  <defs>
    <linearGradient id="chr-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fda4af"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <!-- icon: a timeline of recently touched files (newest on top) -->
  <g>
    <line x1="42" y1="38" x2="42" y2="122" stroke="#3a4150" stroke-width="3" stroke-linecap="round"/>
    <circle cx="42" cy="44" r="9" fill="url(#chr-g)"/>
    <circle cx="42" cy="80" r="8" fill="#4b5563"/>
    <circle cx="42" cy="116" r="8" fill="#4b5563"/>
    <rect x="60" y="39" width="56" height="10" rx="5" fill="url(#chr-g)"/>
    <rect x="60" y="75" width="48" height="10" rx="5" fill="#4b5563"/>
    <rect x="60" y="111" width="40" height="10" rx="5" fill="#4b5563"/>
  </g>

  <!-- wordmark -->
  <text x="150" y="92"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="700" font-size="52" letter-spacing="-1.5"
        fill="#f5f5f5">chronicle</text>

  <!-- tagline -->
  <text x="152" y="120"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-style="italic" font-size="15"
        fill="#b5b5b5">read &amp; write file history</text>
</svg>
